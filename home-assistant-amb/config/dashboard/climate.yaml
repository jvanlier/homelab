views:
  - title: Inside vs Outside
    path: inside-vs-outside
    icon: mdi:sun-thermometer
    type: panel
    cards:
      - type: custom:apexcharts-card
        apex_config:
          chart:
            height: 400px
        header:
          title: Inside versus outside temperature
          show: true
          show_states: true
          colorize_states: true
        graph_span: 32h
        span:
          offset: +8h
        yaxis:
          - min: 18
            decimals: 0
            apex_config:
              tickAmount: 9
        hours_12: false
        all_series_config:
          stroke_width: 3
          fill_raw: last
        series:
          - entity: sensor.climate_ground_floor_temperature
            name: Ground floor
            unit: "°C"
            extend_to: now
            color: "#3F51B5"
            opacity: 0.9
            type: line
            stroke_width: 3
          - entity: sensor.climate_first_floor_temperature
            name: First floor
            extend_to: now
            color: "#FFC107"
            opacity: 0.9
            type: line
            stroke_width: 3
          - entity: sensor.climate_second_floor_temperature
            name: Second floor
            extend_to: now
            color: "#F44336"
            opacity: 0.9
            type: line
            stroke_width: 3
          - entity: sensor.openweathermap_temperature
            name: Outside
            extend_to: now
            color: "#a8a8a8"
            opacity: 0.3
            type: area
            stroke_width: 0
          - entity: sensor.weather_forecast_hourly
            name: Outside forecast
            unit: "°C"
            color: "#cccccc"
            opacity: 0.3
            type: area
            stroke_width: 0
            extend_to: end
            show:
              in_header: false
              legend_value: false
            data_generator: >
              const forecast = entity.attributes.forecast;
              if (!forecast || !forecast.length) return [];
              const now = Date.now();
              const future = forecast.filter(e => new Date(e.datetime).getTime() > now);
              const past = forecast.filter(e => new Date(e.datetime).getTime() <= now);
              if (!future.length) return [];
              const prev = past[past.length - 1];
              const next = future[0];
              let nowTemp;
              if (prev && next) {
                const t0 = new Date(prev.datetime).getTime();
                const t1 = new Date(next.datetime).getTime();
                const ratio = (now - t0) / (t1 - t0);
                nowTemp = prev.temperature + ratio * (next.temperature - prev.temperature);
              } else {
                nowTemp = next.temperature;
              }
              return [[now, nowTemp], ...future.map(e => [new Date(e.datetime).getTime(), e.temperature])];

  - title: Fans
    path: fans
    icon: mdi:fan
    type: sections
    max_columns: 2
    badges:
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.climate_study_feels_like_temperature
        name: Study feels like
        icon: mdi:chair-rolling
        color: "#00c3b1"
      - type: entity
        show_name: true
        show_state: true
        show_icon: true
        entity: sensor.climate_bedroom_jc_feels_like_temperature
        name: Bedroom JC feels like
        icon: mdi:bed
        color: "#ff5746"
    sections:
      - type: grid
        cards:
          - type: heading
            heading: Fans
            heading_style: title
            icon: mdi:fan
          - type: heading
            heading: Study
            heading_style: subtitle
            icon: mdi:chair-rolling
          - type: tile
            entity: fan.fan_study
            features:
              - type: fan-speed
          - type: tile
            entity: switch.fan_study_night_mode
            name: Night Mode
            icon: mdi:weather-night
            tap_action:
              action: toggle
          - type: tile
            entity: switch.fan_study_child_lock
            name: Child Lock
            icon: mdi:lock
            tap_action:
              action: toggle
          - type: tile
            entity: script.fan_study_turn_on
            name: Turn On at Calculated Speed
            icon: mdi:fan-auto
            hide_state: true
            tap_action:
              action: call-service
              service: script.fan_study_turn_on
          - type: heading
            heading: Bedroom JC
            heading_style: subtitle
            icon: mdi:bed
          - type: tile
            entity: fan.fan_bedroom_jc
            features:
              - type: fan-speed
          - type: tile
            entity: switch.fan_bedroom_jc_night_mode
            name: Night Mode
            icon: mdi:weather-night
            tap_action:
              action: toggle
          - type: tile
            entity: switch.fan_bedroom_jc_child_lock
            name: Child Lock
            icon: mdi:lock
            tap_action:
              action: toggle
          - type: tile
            entity: script.fan_bedroom_jc_turn_on
            name: Turn On at Calculated Speed
            icon: mdi:fan-auto
            hide_state: true
            tap_action:
              action: call-service
              service: script.fan_bedroom_jc_turn_on
      - type: grid
        cards:
          - type: heading
            heading: Temperature
            heading_style: title
            icon: mdi:thermometer
          - type: custom:apexcharts-card
            apex_config:
              chart:
                height: 280px
            header:
              show: true
              title: Actual vs feels-like temperature
              show_states: true
              colorize_states: true
            graph_span: 24h
            hours_12: false
            all_series_config:
              stroke_width: 3
            series:
              - entity: sensor.climate_study_feels_like_temperature
                name: Study feels like
                extend_to: now
                color: "#00c3b1"
                opacity: 0.9
                type: line
              - entity: sensor.climate_study_temperature
                name: Study actual
                extend_to: now
                color: "#009688"
                opacity: 0.6
                type: line
              - entity: sensor.climate_bedroom_jc_feels_like_temperature
                name: Bedroom JC feels like
                extend_to: now
                color: "#ff5746"
                opacity: 0.9
                type: line
              - entity: sensor.climate_bedroom_jc_temperature
                name: Bedroom JC actual
                extend_to: now
                color: "#c3362b"
                opacity: 0.6
                type: line
      - type: grid
        cards:
          - type: heading
            heading: Settings
            heading_style: title
            icon: mdi:cog
          - type: heading
            heading: Study
            heading_style: subtitle
            icon: mdi:chair-rolling
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: tile
                entity: input_number.fan_study_start_temp
                name: Start Feels Like Temp
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: input_number.fan_study_end_temp
                name: End Feels Like Temp
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: input_number.fan_study_end_pct
                name: End Speed
                features:
                  - type: numeric-input
                    style: buttons
          - type: heading
            heading: Bedroom JC
            heading_style: subtitle
            icon: mdi:bed
          - type: horizontal-stack
            grid_options:
              columns: full
            cards:
              - type: tile
                entity: input_number.fan_bedroom_jc_start_temp
                name: Start Feels Like Temp
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: input_number.fan_bedroom_jc_end_temp
                name: End Feels Like Temp
                features:
                  - type: numeric-input
                    style: buttons
              - type: tile
                entity: input_number.fan_bedroom_jc_end_pct
                name: End Speed
                features:
                  - type: numeric-input
                    style: buttons
          - type: custom:plotly-graph
            grid_options:
              columns: full
            refresh_interval: 2
            title: Desired fan speed vs feels-like temperature
            layout:
              height: 260
              margin:
                t: 16
                r: 16
                b: 64
                l: 56
              xaxis:
                title: "Feels Like Temperature (°C)"
                type: linear
                range: [18, 32]
                dtick: 2
              yaxis:
                title: "Speed (%)"
                range: [0, 100]
                dtick: 20
            entities:
              - entity: ""
                name: Study
                line:
                  color: "#009688"
                x: $ex (() => { const s=Number(hass.states['input_number.fan_study_start_temp'].state), e=Number(hass.states['input_number.fan_study_end_temp'].state); const xs=[]; for(let t=18;t<=32.0001;t+=0.5)xs.push(t); return xs; })()
                y: $ex (() => { const s=Number(hass.states['input_number.fan_study_start_temp'].state), e=Number(hass.states['input_number.fan_study_end_temp'].state), p=Number(hass.states['input_number.fan_study_end_pct'].state); const ys=[]; for(let t=18;t<=32.0001;t+=0.5){let y; if(t<s||e<=s)y=0; else if(t>=e)y=p; else y=1+(p-1)*(t-s)/(e-s); ys.push(Math.round(y*10)/10);} return ys; })()
              - entity: ""
                name: Bedroom JC
                line:
                  color: "#f44336"
                x: $ex (() => { const s=Number(hass.states['input_number.fan_bedroom_jc_start_temp'].state), e=Number(hass.states['input_number.fan_bedroom_jc_end_temp'].state); const xs=[]; for(let t=18;t<=32.0001;t+=0.5)xs.push(t); return xs; })()
                y: $ex (() => { const s=Number(hass.states['input_number.fan_bedroom_jc_start_temp'].state), e=Number(hass.states['input_number.fan_bedroom_jc_end_temp'].state), p=Number(hass.states['input_number.fan_bedroom_jc_end_pct'].state); const ys=[]; for(let t=18;t<=32.0001;t+=0.5){let y; if(t<s||e<=s)y=0; else if(t>=e)y=p; else y=1+(p-1)*(t-s)/(e-s); ys.push(Math.round(y*10)/10);} return ys; })()
          - type: markdown
            content: |
              | | Study | Bedroom JC |
              |---|---|---|
              | **On** | Workstation in use (plug > 60 W) | 21:00, if someone home |
              | **Off** | Workstation idle | 09:00 |
              | **Night mode** | — | 22:00 |

              _Hardcoded in the automation — cannot be changed here._
            grid_options:
              columns: full

  - title: Measurements per floor
    path: measurements-per-floor
