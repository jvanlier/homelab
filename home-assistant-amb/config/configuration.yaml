# Configure a default setup of Home Assistant (frontend, api, etc)
default_config:

# Trust Caddy on the same host for forwarded client addresses.
http:
  use_x_forwarded_for: true
  trusted_proxies:
    - 127.0.0.1

# Text to speech
tts:
  - platform: google_translate

recorder:
  purge_keep_days: 30  # default is 10 days
  exclude:
    entity_globs:
      # High-frequency sensors that bloat the database
      - sensor.*_last_seen

# Dirs to include
automation: !include_dir_merge_list automation/
sensor: !include_dir_merge_list sensor/
template: !include_dir_merge_list template/

# Files to include
input_boolean: !include input_boolean.yaml
input_datetime: !include input_datetime.yaml
input_number: !include input_number.yaml
input_text: !include input_text.yaml
lovelace: !include lovelace.yaml
logbook: !include logbook.yaml
script: !include script.yaml
binary_sensor: !include binary_sensor.yaml
light: !include light.yaml
mqtt: !include mqtt.yaml

# Custom component config files to include
adaptive_lighting: !include adaptive_lighting.yaml
