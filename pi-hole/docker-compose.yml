version: "3"

# https://github.com/pi-hole/docker-pi-hole/blob/master/README.md

services:
  pihole:
    container_name: pihole
    image: pihole/pihole:latest
    # For DHCP it is recommended to remove these ports and instead add: network_mode: "host"
    # We have a static IP allocated via the router on Pi's mac, so not needed.
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "8001:80/tcp"
    environment:
      - TZ=Europe/Amsterdam
      - WEBPASSWORD=${WEBPASSWORD}
      # Since pihole v6 it only accepts connections within Docker by default:
      - FTLCONF_dns_listeningMode=ALL
      # Quad9 upstreams block known malicious domains.
      - FTLCONF_dns_upstreams=9.9.9.9;149.112.112.112
    # Volumes store your data between container upgrades
    volumes:
      - './etc-pihole:/etc/pihole'
      - './etc-dnsmasq.d:/etc/dnsmasq.d'
      # run `touch ./var-log/pihole.log` first unless you like errors
      - './var-log/pihole.log:/var/log/pihole.log'
    # Recommended but not required (DHCP needs NET_ADMIN)
    #   https://github.com/pi-hole/docker-pi-hole#note-on-capabilities
    cap_add:
      - NET_ADMIN
    restart: unless-stopped
