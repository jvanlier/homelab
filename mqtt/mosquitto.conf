# Each listener has its own auth settings, so the internal listener stays
# anonymous while the LAN listener requires a login and ACL.
per_listener_settings true

# Internal: trusted services on the Pi (loopback publish + `mqtt` Docker net).
listener 1883
allow_anonymous true

# LAN: TLS for Wi-Fi devices (AWTRIX clocks on the IoT VLAN). Published only on
# the Pi's LAN address; UniFi allows only specific IoT devices to reach it.
listener 8883
certfile /mosquitto/lan/server.crt
keyfile /mosquitto/lan/server.key
allow_anonymous false
password_file /mosquitto/lan/passwd
acl_file /mosquitto-acl.conf
