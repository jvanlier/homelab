services:
  mqtt:
    image: eclipse-mosquitto:2.0
    container_name: mqtt
    restart: unless-stopped
    volumes:
      - ./mosquitto-data:/mosquitto
      - ./mosquitto.conf:/mosquitto.conf:ro
      - ./acl.conf:/mosquitto-acl.conf:ro
      # Generated on the Pi, not in git: TLS cert/key and LAN passwords.
      - ./lan:/mosquitto/lan
    ports:
      # Internal, loopback-only and anonymous: HA/frigate reach it via host
      # localhost; z2m/teslamate use the shared `mqtt` Docker net, NOT the
      # published port.
      - "127.0.0.1:1883:1883"
      # TLS + login for LAN/IoT devices only (see README "LAN listener").
      - "192.168.1.138:8883:8883"
    command: "mosquitto -c /mosquitto.conf"
    networks:
      - mqtt

networks:
  mqtt:
    external: true
