services:
  caddy:
    image: caddy:2.10.2
    restart: unless-stopped
    network_mode: host
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in caddy/.env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
