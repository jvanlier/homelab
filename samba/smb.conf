[global]
   server role = standalone server
   security = user
   map to guest = never
   multicast dns register = no
   vfs objects = fruit streams_xattr
   fruit:metadata = stream

[pi-share]
   path = /shares/media
   browseable = yes
   read only = yes
   guest ok = no
   valid users = media

[TimeMachine-Jori]
   path = /shares/jori
   browseable = yes
   read only = no
   guest ok = no
   valid users = tm-jori
   fruit:time machine = yes
   fruit:time machine max size = 480G

[TimeMachine-Chantal]
   path = /shares/chantal
   browseable = yes
   read only = no
   guest ok = no
   valid users = tm-chantal
   fruit:time machine = yes
   fruit:time machine max size = 240G
